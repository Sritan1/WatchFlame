# Pre-commit hooks. Install once with:  pip install pre-commit && pre-commit install
# Run against all files:  pre-commit run --all-files
repos:
  # Block secrets (API keys, tokens, private keys) from ever being committed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Basic hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

  # Lint the Python backend (ruff is already a dev dependency).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^api/
