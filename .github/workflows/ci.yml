name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Run tests
        run: python -m pytest api/ -q
      - name: Dependency audit (advisory)
        # Surfaces known CVEs without hard-failing every PR on an upstream
        # advisory; review the report and pin/upgrade as needed.
        continue-on-error: true
        run: pip-audit -r api/requirements.txt

  web:
    name: Web (typecheck + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        # `npm install`, not `npm ci`: the lockfile is generated on Windows and
        # omits a Linux-only transitive optional subtree (the WASM runtime of
        # Tailwind v4's native engine — @napi-rs/wasm-runtime -> @emnapi/*), so
        # the strict `npm ci` integrity check fails on the Linux runner with
        # "Missing @emnapi/core/runtime from lock file". `npm install` reconciles
        # and installs the same versions without that cross-platform strictness,
        # and matches how Vercel installs for deploy. This job only type-checks,
        # so bit-for-bit reproducibility isn't required here.
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
